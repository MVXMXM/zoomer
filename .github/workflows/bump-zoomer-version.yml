name: Bump zoomer version

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    # The bump commit is also a push to master. Skipping it stops the version from climbing on its own.
    if: "${{ !startsWith(github.event.head_commit.message, 'Zoomer: bump version') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - run: node scripts/bump-zoomer-version.mjs
      - name: Commit the patch bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zoomer-version.json package.json package-lock.json README.md
          # This message is the production-deploy signal. Keep the prefix in sync with scripts/vercel-ignore-build.mjs.
          git commit -m "Zoomer: bump version"
          git push origin HEAD:master
